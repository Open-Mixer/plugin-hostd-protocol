name: shared-checks

# The shared checks run from Open-Mixer/.github and are not copied here: this repository keeps no copy of them and its
# commit-msg hook is the shared stub, byte for byte (a missing hook is refused too).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-local-copies:
    name: the shared checks are not copied here
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/no-local-copies@openmixer-v1
