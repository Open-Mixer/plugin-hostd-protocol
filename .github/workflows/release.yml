# SPDX-License-Identifier: GPL-3.0-or-later
name: release

# Packages through the shared release workflows of Open-Mixer/.github. A tag v<version> builds signed
# RPMs (Fedora 45, x86_64) and DEBs (Debian trixie, arm64) while the release matrix is quick (OMX_RELEASE_MATRIX=quick;
# the full set returns with OMX_RELEASE_MATRIX=full),
# publishes them to the OpenMixer channel and attaches them to the GitHub release. A dispatched run
# (workflow_dispatch) is a dry run: it builds and lints everything and publishes nothing, unless it names a
# tag in source-ref and sets publish: then it releases that tag's sources with this workflow (a tag whose own
# release workflow can no longer run).
# A dispatched run with staged on (never a tag) builds the staged matrix of Open-Mixer/.github's build-rpm.yml and
# build-deb.yml, which own it for every repository (the wave's quick matrix is Open-Mixer/.github#42), and publishes it
# to the staging channel for the next layer of the release chain to build against; nothing reaches the real channel,
# and the release still publishes once from the v<version> tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source-ref:
        description: 'Tag v<version> to release from this workflow; empty is a dry run of the branch'
        type: string
        default: ''
      publish:
        description: 'With source-ref: sign and publish that tag'
        type: boolean
        default: false
      republish:
        description: 'Let the release go out over a version the channel already serves (finish a partial publish)'
        type: boolean
        default: false
      staged:
        description: 'Build fc45 x86_64 and trixie arm64 only and publish them to the staging channel, never to the real one'
        type: boolean
        default: false
      same_pass:
        description: 'Packages other repositories release later in the same pass, space separated; empty reads .github/release-same-pass at the commit built'
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  # The packages other repositories release LATER in this same pass, for the channel-installability gate's same-pass
  # (a breakage they cause or suffer is reported, not red): a dispatch's same_pass input, else the tracked
  # .github/release-same-pass at the very commit this run builds (the tag on a push, source-ref when one is named), one
  # package per line, # comments allowed. The file is reviewed like code, lives on its release branch and goes with it;
  # never a repository variable, which is mutable, unversioned and can outlive its pass to excuse a later break.
  samepass:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-same-pass
          sparse-checkout-cone-mode: false
      - id: read
        env:
          NAMED_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref || '' }}
        run: |
          f=.github/release-same-pass
          # a named source-ref is fetched and its file read from FETCH_HEAD: no checkout is pinned to a ref (make check-no-pins)
          if [ -n "$NAMED_SOURCE" ]; then
            git fetch --quiet --depth=1 origin "$NAMED_SOURCE" || { echo "::error::cannot fetch source-ref $NAMED_SOURCE"; exit 1; }
            rm -f "$f"
            git show "FETCH_HEAD:$f" >"$f" 2>/dev/null || rm -f "$f"
          fi
          [ -f "$f" ] || { echo "list=" >>"$GITHUB_OUTPUT"; echo "no $f at this commit: nothing released in the same pass"; exit 0; }
          names=$(sed -e 's/#.*//' "$f" | tr -s ' \t\r\n' '\n' | sed '/^$/d')
          for n in $names; do
            [[ "$n" =~ ^[a-z0-9][a-z0-9.+-]*$ ]] || { echo "::error::$f: '$n' is not a package name"; exit 1; }
          done
          list=$(echo $names)
          echo "list=$list" >>"$GITHUB_OUTPUT"
          echo "same pass from $f: ${list:-none}"

  rpm:
    needs: samepass
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      same-pass: ${{ inputs.same_pass || needs.samepass.outputs.list }}
      staged: ${{ inputs.staged == true }}
      package-name: plugin-hostd-protocol
      binary-names: plugin-hostd-protocol plugin-hostd-protocol-devel plugin-hostd-protocol-contract
      publish: ${{ github.ref_type == 'tag' || (inputs.publish == true && inputs.source-ref != '') }}
      source-ref: ${{ inputs.source-ref }}
      republish: ${{ inputs.republish == true }}
      needs-mod-host: false
      # omx-contract-devel (the declared protocol's generator and the contract directory's install script) is the
      # channel's
      channel-deps: true
    secrets: inherit

  # or skipped RPM job skips this one, so no DEB is published after a failed RPM.
  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    needs: samepass
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      same-pass: ${{ inputs.same_pass || needs.samepass.outputs.list }}
      staged: ${{ inputs.staged == true }}
      package-name: libplugin-hostd-protocol
      binary-names: libplugin-hostd-protocol0 libplugin-hostd-protocol-dev plugin-hostd-protocol-contract
      publish: ${{ github.ref_type == 'tag' || (inputs.publish == true && inputs.source-ref != '') }}
      source-ref: ${{ inputs.source-ref }}
      republish: ${{ inputs.republish == true }}
      dependencies: ''
      requires: ''
      # libomx-contract-dev is the channel's
      channel-deps: true
    secrets: inherit
