name: fuzz
# The libFuzzer harnesses of fuzz/ (fuzz/README.md), built with clang under AddressSanitizer and
# UndefinedBehaviorSanitizer and run for 60 s each from their seed corpus. Before the run: every check's
# mutant record is met (make fuzz-records), every fuzz/sabotage/ patch is caught by its own check
# (make fuzz-sabotage), and each harness holds its coverage floor (make fuzz-coverage). A crashing input
# is uploaded as the fuzz-findings artifact. make test stays in ci.yml.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  fuzz:
    name: fuzz the protocol, the dispatcher and the scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: fedora:44
    steps:
      - name: clang, libFuzzer and the sanitizer runtimes
        run: dnf -y install --setopt=install_weak_deps=False --setopt=retries=10 clang compiler-rt llvm gcc make git
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Add the OpenMixer channel
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1
      - name: omx-dsp's curve function, which the dispatcher draws with
        run: dnf -y install 'omx-dsp-devel >= 0.32.0' 'omx-dsp-devel < 0.33'
      - name: Build the harnesses
        run: make fuzz
      - name: Every check's mutant record is met on its own seed
        run: make fuzz-records
      - name: Every sabotage patch is caught by the check it names, and only by it
        run: make fuzz-sabotage
      - name: Each harness holds its coverage floor and reaches every check
        run: make fuzz-coverage
      - name: Fuzz each harness for 60 s
        run: make fuzz-run FUZZ_TIME=60
      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: build/fuzz/artifacts/
          if-no-files-found: ignore
