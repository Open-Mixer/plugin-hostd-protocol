name: public-sources
# The fast checks, on every pull request: the trigger gate (no other workflow of this repository runs on a push or a
# pull request), and the shared checks from Open-Mixer/.github (this pull request's commit messages, no tracked file
# pointing into a private repository, no local copy of the checks, the public layout). Each takes seconds. The builds,
# the test suites, the packages and the fuzzing are in the other workflows, run by workflow_dispatch (ci.yml on a pull
# request's head before it is merged) and on a v* tag.
on:
  pull_request:
concurrency:
  group: public-sources-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  trigger-gate:
    name: only this workflow runs on a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/trigger-gate@openmixer-v1
        with:
          lint-workflow: public-sources.yml
  # the checks every OpenMixer repository runs on what it publishes: commit messages, private references, and no
  # local copy of either (Open-Mixer/.github's public-sources-check)
  public-sources:
    uses: Open-Mixer/.github/.github/workflows/public-sources-check.yml@openmixer-v1
    with:
      commit-identity: true
  # no ceiling anywhere: there is no packaging/deps.txt (no hand-kept floor, owner ruling 2026-11-24, held by make
  # test-no-floors), so Open-Mixer/.github's deps-render renders nothing and refuses every ceiling in the spec,
  # debian/control and the workflow install lines. Same openmixer-v1 ref as every shared action of this repository
  floors:
    name: no ceiling, no deps.txt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/deps-render@openmixer-v1
  # the documentation gates, both standard tools: ruff (D and the default rules, today's findings carried by noqa comments)
  # on the Python clients, and doxygen over the installed headers against tools/doxygen.baseline (a ratchet that only
  # falls); the Makefile reads omx-dsp at parse time, so the job runs the commands without make.
  # ubuntu-24.04, not ubuntu-latest: its doxygen is the 1.9.8 tools/doxygen.version pins, and another doxygen version
  # gives other warning rows, which the gate refuses
  doc-gates:
    name: documentation gates (ruff, doxygen)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen && python3 -m pip install ruff==0.17.5
      # the base the gates may not grow past: the pull request's base branch, else the default branch
      - run: ruff check clients/python && sh tools/doxygen_gate.sh && sh tools/doc_shrink.sh && sh tests/doc_gate_test.sh
        env:
          DOC_GATE_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}

  pr-fixes-issue:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Open-Mixer/.github/.github/workflows/pr-fixes-issue.yml@openmixer-v1
  # a release is never below the highest version the channel ever served any of its packages at, and the library's RPM
  # name installs on Debian (#180): the tool over the real channel, its test and sabotage, and the name test. Without
  # make, which reads omx-dsp at parse time
  served-floor:
    name: no package below the highest version the channel served it at
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/served_floor_test.py . && sh tests/served-floor-sabotage.sh && python3 tools/served-floor.py && python3 tests/rpm_name_on_debian_test.py .
