name: ci
# A push runs on main only; a pull request already runs its branch.
on:
  push:
    branches: [main, dedupe/all]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: build + test (${{ matrix.image }})
    runs-on: ubuntu-latest
    # A backstop only.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'debian:bookworm', 'debian:trixie']
    container: ${{ matrix.image }}
    steps:
      - name: Toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install gcc make git pkgconf-pkg-config diffutils binutils gawk python3 libasan libubsan
          else
            apt-get update && apt-get -y install --no-install-recommends gcc libc6-dev make git pkg-config ca-certificates binutils gawk python3 diffutils
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # omx-contract's C headers, which the declared protocol's generator is built against, are the OpenMixer channel's
      - name: Add the OpenMixer channel
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1
      - name: omx-contract's headers, and omx-dsp's curve function
        run: |
          if command -v dnf >/dev/null; then dnf -y install 'omx-contract-devel >= 3.9.0' 'omx-contract-devel < 4' 'omx-dsp-devel >= 0.32.0' 'omx-dsp-devel < 0.33'; else
            apt-get -y install --no-install-recommends libomx-contract-dev libomxdsp-dev
            v=$(dpkg-query -W -f='${Version}' libomx-contract-dev)
            dpkg --compare-versions "$v" ge 3.9.0~
            dpkg --compare-versions "$v" lt 4~
            v=$(dpkg-query -W -f='${Version}' libomxdsp-dev)
            dpkg --compare-versions "$v" ge 0.32.0~
            dpkg --compare-versions "$v" lt 0.33~
          fi
          pkg-config --exists omx-contract
          pkg-config --exists 'omxdsp >= 0.32.0'
          pkg-config --exists 'omxdsp < 0.33'
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        run: make
      - name: Tests (protocol, golden, install, symbols, version, the generated protocol and its sabotage)
        run: make test

  # The declared protocol with the tools a package build does not carry: the rendered headers are what the installed
  # omx-contract renders from data/verbs.json and from omx-clap-core's package (and a header changed by hand is red), the
  # staged contract package validates, protocol/plugin-hostd.json satisfies its schema, and the grammar holds the
  # scenario corpus, the golden transcript and the table, read by python's abnf parser (and a broken rule is red).
  # plugin-hostd-contract before 0.16.0 declares the same items, so it is not installed here.
  protocol:
    name: declared protocol (render, contract directory, schema, grammar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:44
    steps:
      - name: Toolchain
        run: dnf -y install gcc make git pkgconf-pkg-config diffutils python3 python3-jsonschema
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Add the OpenMixer channel
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1
      - name: omx-contract and omx-clap-core's and plugin-db's packages of the contract directory
        run: |
          set -euo pipefail
          dnf -y install 'omx-contract >= 3.9.0' 'omx-contract < 4' 'omx-contract-devel >= 3.9.0' 'omx-contract-devel < 4' omx-clap-core-contract 'plugin-db-contract >= 0.2.0' 'plugin-db-contract < 0.3' 'omx-dsp-devel >= 0.32.0' 'omx-dsp-devel < 0.33'
          if rpm -q plugin-hostd-contract; then echo "plugin-hostd-contract is installed: it declares the same items"; exit 1; fi
      - name: The python ABNF parser
        run: |
          python3 -m venv /opt/abnf
          /opt/abnf/bin/pip install 'abnf>=2.2'
      - name: make check-protocol-tools
        run: make check-protocol-tools PYTHON=/opt/abnf/bin/python

  abi:
    name: ABI check (abidiff against abi/)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:44
    steps:
      - name: Toolchain
        run: dnf -y install gcc make git pkgconf-pkg-config diffutils binutils gawk libabigail
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Add the OpenMixer channel
        uses: FreeMixer/.github/.github/actions/add-openmixer@v1
      - name: omx-dsp's curve function
        run: dnf -y install 'omx-dsp-devel >= 0.32.0' 'omx-dsp-devel < 0.33'
      - name: Exported symbols
        run: make test-abi
      - name: Types against the baseline
        run: make abi-check
