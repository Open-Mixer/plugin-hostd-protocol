name: ci
# Run by workflow_dispatch: on a pull request's head before it is merged (gh workflow run ci.yml --ref <branch>),
# and on demand. The fast checks run on every pull request from public-sources.yml. The schedule renders against what
# the channel serves now, so a served contract package that changes the render turns main red when it is served (#27):
# only the declared-protocol job runs on it.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Every dispatch has a group of its own (the run id) and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # no Fedora release written into a job: the cells come from check-matrix (rule 11-10, ruling D25)
  fedora-cells:
    # the schedule is the render check alone (#27)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - uses: Open-Mixer/.github/.github/actions/fedora-cells@openmixer-v1

  # the cells the jobs run on: check-matrix's answer (fc45 x86_64 rpm, trixie arm64 deb; the quick set while a release
  # wave is open), each with the runner of its own architecture: an amd64 container cannot install the arm64-only -dev
  # debs. It runs on the schedule too: the render reads its cells from here (served_render_ci's one exception, #27)
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rpm: ${{ steps.m.outputs.rpm }}
      rpm-count: ${{ steps.m.outputs.rpm-count }}
      cells: ${{ steps.m.outputs.cells }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          rpm-releases: '["45"]'
          rpm-arches: '["x86_64"]'
          deb-releases: '["trixie"]'
          deb-arches: '["arm64"]'
          x86-runner: ${{ vars.OMX_RUNNER || 'ubuntu-latest' }}

  test:
    name: build + test (${{ matrix.cell.image }})
    needs: checks
    # the schedule is the render check alone (#27)
    if: github.event_name != 'schedule' && needs.checks.outputs.count != '0'
    runs-on: ${{ matrix.cell.runner }}
    # A backstop only.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ruling D25: while the org's OMX_RELEASE_MATRIX is quick, CI covers the quick cells only; the deb cells are
        # trixie alone (bookworm is dropped from the matrix, owner 2026-11-27)
        cell: ${{ fromJSON(needs.checks.outputs.cells) }}
    # privileged only to lower the runner kernel's mmap_rnd_bits: with the hosted image's 32 bits, an older gcc's
    # AddressSanitizer dies in DEADLYSIGNAL loops or hangs until the timeout
    container:
      image: ${{ matrix.cell.image }}
      options: --privileged
    steps:
      - name: Address space randomisation AddressSanitizer can run under
        run: |
          if [ "$(cat /proc/sys/vm/mmap_rnd_bits)" -gt 28 ]; then echo 28 > /proc/sys/vm/mmap_rnd_bits; fi
          echo "vm.mmap_rnd_bits=$(cat /proc/sys/vm/mmap_rnd_bits)"
      - name: Toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install gcc make git pkgconf-pkg-config diffutils binutils gawk python3 libasan libubsan
          else
            apt-get update && apt-get -y install --no-install-recommends gcc libc6-dev make git pkg-config ca-certificates binutils gawk python3 diffutils
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # omx-contract's C headers, which the declared protocol's generator is built against, are the OpenMixer channel's
      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
      # and the codec's tests read omx-contract's catalog reader (issue 46)
      - name: omx-contract's headers, and omx-dsp's curve function
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null; then
            dnf builddep -y --setopt=install_weak_deps=False packaging/plugin-hostd-protocol.spec
          else
            apt-get -o Dpkg::Options::=--force-unsafe-io build-dep -y --no-install-recommends ./
          fi
          pkg-config --exists omx-contract
          pkg-config --exists omxdsp
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        run: make
      - name: Tests (protocol, golden, install, symbols, version, the generated protocol and its sabotage)
        run: make test
      # the table-driven TypeScript codec (clients/typescript/codec) on the shared vectors, with omx-contract's staged
      # vocabulary and catalogs as test-codec reads them, so the sentence arms run. Fedora cells only: node 22 or later.
      # GroupingReason and RETRY_REASONS are written from plugin-hostd's domain plugin-hostd/grouping (tools/grouping-reasons.py)
      # and held to the 16 golden reasons by the codec's tests; no file of plugin-hostd is fetched.
      - name: The TypeScript codec on the shared vectors, and its grouping reasons held to the golden list
        if: ${{ contains(matrix.cell.image, 'fedora') }}
        run: |
          set -euo pipefail
          # the builddeps may already carry node 22 (a second nodejs conflicts with it): add only what is missing
          command -v node >/dev/null || dnf -y install nodejs
          command -v npm >/dev/null || dnf -y install npm
          make test-ts-codec
          # nodejs-plugin-hostd-protocol's tree as a Node consumer imports it: the bare name and ./client, every vector
          make test-node-installed PREFIX=/usr

  # The declared protocol with the tools a package build does not carry: the rendered headers are what the installed
  # omx-contract renders from this tree's domains plugin-hostd-protocol, host and hosting-verb (contract.d), nothing of
  # plugin-db's (#163; a header changed by hand is red), the staged contract package validates,
  # protocol/plugin-hostd.json satisfies its schema, and the grammar holds the scenario corpus, the golden transcript
  # and the table, read by python's abnf parser (and a broken rule is red). Nothing of omx-clap-core is read: the
  # chain publishes this protocol first, and omx-clap-core reads its domains host and hosting-verb from here (#67).
  protocol:
    name: declared protocol (render, contract directory, schema, grammar) (${{ matrix.cell.image }})
    needs: checks
    if: needs.checks.outputs.rpm-count != '0'
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.rpm) }}
    container:
      image: ${{ matrix.cell.image }}
    steps:
      - name: Toolchain
        run: dnf -y install gcc make git pkgconf-pkg-config diffutils python3 python3-jsonschema python3-pyyaml
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
      - name: omx-contract
        run: |
          set -euo pipefail
          dnf -y install omx-contract
          dnf builddep -y --setopt=install_weak_deps=False packaging/plugin-hostd-protocol.spec
      # an ordinary run renders and builds against what consumers get, the channel: name where each omx package came
      # from, and refuse one from the staging channel (#27: a stale staged contract package outranked the channel)
      # a pull request into devel builds against the staging channel (devel -> staging -> prod, Open-Mixer/.github
      # add-openmixer): there a package from staging is expected; anywhere else one is refused as before
      - name: Every contract package comes from the channel
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          dnf repoquery --installed --qf '%{name} %{version} %{from_repo}\n' 'omx-*' | tee /tmp/from-repo
          case $EVENT:$BASE in
            pull_request*:devel) echo "a pull request into devel: a package from the staging channel is expected here" ;;
            *) if grep staging /tmp/from-repo; then echo "a package above came from the staging channel: an ordinary run builds against the channel"; exit 1; fi ;;
          esac
      - name: The python ABNF parser
        run: |
          python3 -m venv /opt/abnf
          /opt/abnf/bin/pip install 'abnf>=2.2'
      - name: make check-protocol-tools
        run: make check-protocol-tools PYTHON=/opt/abnf/bin/python
      # check-rendered prints the difference (#26); this names what the channel served when it was taken
      - name: The served packages the render ran against
        if: failure()
        run: |
          echo "::error::the render check failed against these served contract packages:"
          cat /tmp/from-repo 2>/dev/null || echo "(the job failed before the served packages were listed)"
      # one pack per listed language from the spec and debian/control, and the catalogs through omx-contract's release
      # gate (translate --check): a listed language with no catalog, a missing key or a stale entry is red (#15)
      - name: The language packs
        uses: Open-Mixer/.github/.github/actions/langpacks@openmixer-v1
        with:
          name: plugin-hostd-protocol
          base: plugin-hostd-protocol-contract
          owner: plugin-hostd-protocol
          spec: packaging/plugin-hostd-protocol.spec
          gate: make check-catalogs

  # The reply shapes (doc/reply-shapes.md): shapes/ held to the table and to the replies, ts/shapes/ the render omx-contract
  # writes with its json-schema-to-typescript, and the npm package as a consumer imports it. Each guard is broken in a
  # scratch copy and must go red (test-shapes-sabotage). omx-contract is read from its source, not from the channel: the
  # generator is a dev dependency there (npm ci) and no served package carries it. Its branch is the one this run's
  # packages come from, never a hand-kept commit: a pull request's base (devel -> staging, main -> the channel), a push
  # or dispatch on main main, anything else devel. The commit read is printed.
  shapes:
    name: reply shapes (schemas, TypeScript render, npm package)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-jsonschema
      - name: omx-contract from its source on this run's branch, with its generator
        env:
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$BASE" in
            main|devel) branch=$BASE ;;
            '') if [ "$REF" = main ]; then branch=main; else branch=devel; fi ;;
            *) echo "a pull request into $BASE: omx-contract has no branch for it (main or devel)" >&2; exit 1 ;;
          esac
          src=$RUNNER_TEMP/omx-contract
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/Open-Mixer/omx-contract "refs/heads/$branch"
          sha=$(git -C "$src" rev-parse -q --verify 'FETCH_HEAD^{commit}') || { echo "omx-contract's $branch did not resolve" >&2; exit 1; }
          git -C "$src" checkout -q "$sha"
          echo "omx-contract $branch at $sha"
          (cd "$src" && npm ci --no-audit --no-fund)
          echo "OMX_CONTRACT_DIR=$src" >> "$GITHUB_ENV"
      - name: The schemas against the table and the replies
        run: make test-reply-shapes
      - name: The TypeScript render is what the schemas render
        run: make check-shapes-render
      - name: The package, as a consumer imports it
        run: make test-ts-package
      - name: One TypeScript encoder, the codec; the client and curvePoints over it
        run: make test-ts-client
      - name: Each guard goes red on its fault
        run: make test-shapes-sabotage
      - name: The version of package.json
        run: make version-check
      - name: No package below the highest version the channel ever served it at (#180)
        run: make test-served-floor served-floor

  abi:
    # the baseline abi/ is written by fc45's libabigail (make abi-baseline there): an abidiff refuses a baseline of
    # another libabigail format version, so the comparison runs on the image that wrote it
    name: "ABI: types against the baseline (the baseline writer's libabigail)"
    # the schedule is the render check alone (#27)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:45  # tool image: the libabigail that wrote the abi/ baseline: a tool artefact, not a release cell
    steps:
      - name: Toolchain
        run: dnf -y install gcc make git pkgconf-pkg-config diffutils binutils gawk libabigail
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
      - name: omx-dsp's curve function
        run: dnf builddep -y --setopt=install_weak_deps=False packaging/plugin-hostd-protocol.spec
      - name: Exported symbols
        run: make test-abi
      - name: Types against the baseline
        run: make abi-check
